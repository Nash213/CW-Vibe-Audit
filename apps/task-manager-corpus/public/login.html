<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Task Manager</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="/" class="nav-brand">
      <span class="brand-icon">📋</span>
      <span>TaskFlow</span>
    </a>
  </header>

  <main class="container">
    <div class="auth-container">
      <div class="card">
        <div class="card-header" style="text-align: center;">
          <h1 class="card-title">Welcome Back</h1>
          <p class="card-subtitle">Log in to manage your tasks</p>
        </div>

        <div id="auth-alert" class="alert alert-danger hidden" role="alert"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input 
              type="email" 
              id="email" 
              class="form-control" 
              placeholder="you@example.com" 
              required 
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            >
          </div>

          <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">
            Log In
          </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
          Don't have an account? <a href="/signup">Sign up</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <p>TaskFlow &copy; 2026 &bull; Keep track of your tasks simply.</p>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
