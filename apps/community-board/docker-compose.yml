services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: board
      POSTGRES_USER: board
      POSTGRES_PASSWORD: board_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d board"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://board:board_password@db:5432/board
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
