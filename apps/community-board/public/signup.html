<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — Community Board</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">Community Board</a>
      <nav id="nav" class="nav"></nav>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h1>Create an account</h1>
      <div id="signup-error" class="error" hidden></div>
      <form id="signup-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="display-name">Display name</label>
          <input id="display-name" type="text" minlength="2" maxlength="50" required>
        </div>
        <div class="form-group">
          <label for="password">Password (at least 6 characters)</label>
          <input id="password" type="password" minlength="6" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Sign up</button>
      </form>
      <p style="margin-bottom:0;">Already have an account? <a href="/login">Log in</a></p>
    </section>
  </main>

  <script src="/common.js"></script>
  <script>
    initNav();

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('signup-error');
      errBox.hidden = true;
      try {
        await api('/api/auth/signup', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            displayName: document.getElementById('display-name').value,
            password: document.getElementById('password').value,
          }),
        });
        window.location.href = '/';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.hidden = false;
      }
    });
  </script>
</body>
</html>
