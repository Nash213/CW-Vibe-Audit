services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_FILE: /app/data/store.json
      PGHOST: db
      PGPORT: "5432"
      PGUSER: clearlist
      PGPASSWORD: clearlist_dev_password
      PGDATABASE: clearlist
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clearlist
      POSTGRES_PASSWORD: clearlist_dev_password
      POSTGRES_DB: clearlist
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearlist -d clearlist"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app_data:
  postgres_data:
